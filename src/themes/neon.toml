# Neon: leuchtende Linien und Farbcodes auf Rauchglas-Plättchen, die jeder
# Form und Legendenzeile eng folgen und einen Hauch des Farbtons dessen
# annehmen, was auf ihnen liegt; ein kurzer Schleier verbindet nahe
# Nachbarn. Alles leuchtet ein wenig — Linien, Schrift, Weißes —, aber
# leise genug, dass nichts blendet.
label = "Neon"
order = 5

[colors]
text = "#ffffff"                # gebundene Legenden so hell wie die Beschriftungen

[text]
dim = 0                         # alle Legenden in voller Stärke

[shadow]
preset = "aura"
# Unter einer farbigen Linie oder Legende ein sehr tiefer, kaum gesättigter
# Ton derselben Farbe; um weiße Legenden bleibt die Platte neutral.
tint = true
tint_value = 0.12
tint_saturation = 0.5
# Ein schmaler, schwacher Schein um alles Helle: farbige Linien in ihrer
# Farbe, weiße Linien, Ringe und Buchstaben halb so stark in Weiß, Schrift
# etwas schwächer als Linien, damit kleine Buchstaben scharf bleiben.
glow_alpha = 0.4
glow_radius = 4
glow_neutral = 0.5
glow_text = true
glow_text_alpha = 0.6

[connector]
glow = 0.55                     # die Gestenlinie leuchtet, aber blendet nicht
glow_radius = 5

# Leicht abgedunkelt hinter dem offenen HUD, heller als Wireframe; die Mitte
# bleibt klarer.
[backdrop]
color = "#06070d"
opacity = 0.25
vignette = 0.55
