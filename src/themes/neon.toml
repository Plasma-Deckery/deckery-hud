# Neon: leuchtende Linien und Farbcodes auf Rauchglas-Plättchen, die jeder
# Form und Legendenzeile eng folgen und den Farbton dessen annehmen, was
# auf ihnen leuchtet; ein kurzer Schleier verbindet nahe Nachbarn. Sonst die
# Standardwerte aller Tokens.
label = "Neon"
order = 0

[colors]
text = "#ffffff"                # gebundene Legenden so hell wie die Beschriftungen

[text]
dim = 0                         # alle Legenden in voller Stärke

[shadow]
preset = "aura"
# Die Platte nimmt dort, wo eine farbige Linie oder Legende liegt, einen
# sehr tiefen Ton derselben Farbe an — der Schleier leuchtet darin mit;
# um weiße Legenden bleibt sie neutral.
tint = true
tint_value = 0.17
tint_saturation = 0.85
# Alles Helle leuchtet: farbige Linien und Legenden in ihrer Farbe, weiße
# in Weiß; die dunkle Kante darüber hält die Buchstaben scharf.
glow_alpha = 0.75
glow_radius = 4
glow_neutral = 1.0
glow_text = true
glow_text_alpha = 0.9
