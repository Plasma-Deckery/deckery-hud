# Farbe nach Modifier: was ein Modifier freischaltet, trägt seine Farbe —
# L1 Desktop (blau), R1 Applikation (orange), ··· System (violett).
# L1+R1 (Fenster) zählt zum Desktop. App-Ebenen bleiben türkis.
label = "Farbe nach Modifier"
order = 30

[modifiers]
L1 = "#82bdff"
R1 = "#ffa53a"
"···" = "#c4a0ff"
