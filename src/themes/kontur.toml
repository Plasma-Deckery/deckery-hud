# Kontur: nichts gefüllt, keine Platte, keine Wolke — kräftige Linien und
# Schrift mit einem harten, kurzen Schlagschatten nach rechts unten, der sie
# auf jedem Untergrund lesbar hält. Legenden in Großbuchstaben, die Pille
# nur als Umriss. Alle Schattenwerte stehen hier selbst (unabhängig von B-14).
label = "Kontur"
order = 50

[shape]
width = 2.4
outline = "#ffffffe6"

[stick]
ring = "#ffffff00"
cap = "#00000000"
cap_border = "#ffffffe6"
width = 1.6

[callout]
width = 1.8
dot = 3.5

[text]
weight = "Semi-Bold"
transform = "upper"
scale = 0.92

[pill]
top = "#ffffff00"
bottom = "#ffffff00"
sheen = 0
fg = "#ffffff"
border = "#ffffffe6"
shadow = 0

[shadow]
preset = "dezent"
tint = false
core_alpha = 0
bleed_alpha = 0
rim_alpha = 0
glow_alpha = 0
edge_radius = 0.35
edge_alpha = 0.9
offset_x = 2.5
offset_y = 2.5
