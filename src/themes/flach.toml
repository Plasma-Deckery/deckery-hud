# Flach: keine Wolke, kein Schein, kein Rand — jede Form und jede Legende
# sitzt auf einer harten, dunklen Platte. Dünne Konturen, matte Pille.
# Alle Schattenwerte stehen hier selbst, damit sich das Theme nicht mit dem
# Standard-Schatten (B-14) mitbewegt.
label = "Flach"
order = 40

[shape]
width = 1.2
outline = "#ffffff70"
fill = "#ffffff0d"

[callout]
width = 1.4
dot = 2.5
alpha = 1.4

[text]
weight = "Medium"

[pill]
top = "#e8eaeef2"
bottom = "#e8eaeef2"
sheen = 0
shadow = 0

[shadow]
preset = "dezent"
tint = false
shadow_rgb = "#15171d"
core_grow = 9
core_blur = 0.5
core_gain = 8
core_alpha = 0.9
plate_radius = 6
legend = "line"
legend_padx = 10
legend_pady = 5
bleed_alpha = 0
edge_alpha = 0
rim_alpha = 0
glow_alpha = 0
